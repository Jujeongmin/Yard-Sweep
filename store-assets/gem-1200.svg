<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512">
  <defs>
    <radialGradient id="bg" cx="50%" cy="36%" r="74%">
      <stop offset="0%" stop-color="#6a4bb0"/>
      <stop offset="100%" stop-color="#241546"/>
    </radialGradient>
    <radialGradient id="glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#c9b3ff" stop-opacity=".55"/>
      <stop offset="100%" stop-color="#c9b3ff" stop-opacity="0"/>
    </radialGradient>
    <g id="gem">
      <path d="M -30,-50 L 30,-50 L 50,-15 L -50,-15 Z" fill="#9beeff"/>
      <path d="M -50,-15 L 0,-15 L 0,50 Z" fill="#63e6ff"/>
      <path d="M 50,-15 L 0,-15 L 0,50 Z" fill="#36bdec"/>
      <path d="M -50,-15 L 50,-15" stroke="#1683bd" stroke-width="4"/>
      <path d="M -30,-50 L -50,-15 M 30,-50 L 50,-15 M 0,-15 L 0,50" stroke="#1683bd" stroke-width="3" opacity=".45"/>
      <path d="M -30,-50 L 30,-50 L 50,-15 L 0,50 L -50,-15 Z" fill="none" stroke="#12628f" stroke-width="7" stroke-linejoin="round"/>
      <path d="M -20,-43 L -7,-43 L -13,-23 L -25,-23 Z" fill="#ffffff" opacity=".5"/>
    </g>
  </defs>

  <rect width="512" height="512" rx="76" fill="url(#bg)"/>
  <circle cx="256" cy="240" r="205" fill="url(#glow)"/>

  <!-- back gems spilling out -->
  <g transform="translate(126,214) scale(0.5) rotate(-18)"><use href="#gem"/></g>
  <g transform="translate(386,214) scale(0.5) rotate(18)"><use href="#gem"/></g>
  <g transform="translate(180,150) scale(0.58)"><use href="#gem"/></g>
  <g transform="translate(332,150) scale(0.58)"><use href="#gem"/></g>
  <g transform="translate(256,116) scale(0.66)"><use href="#gem"/></g>

  <!-- chest -->
  <g transform="translate(256,318)">
    <!-- lid (open, tilted back) -->
    <g transform="translate(0,-88) rotate(-16)">
      <rect x="-118" y="-46" width="236" height="58" rx="16" fill="#a06a33"/>
      <rect x="-118" y="-46" width="236" height="58" rx="16" fill="none" stroke="#5e3a17" stroke-width="9"/>
      <rect x="-22" y="-46" width="44" height="58" fill="#f2c14e" stroke="#b7861f" stroke-width="6"/>
    </g>
    <!-- body -->
    <rect x="-130" y="-52" width="260" height="122" rx="18" fill="#8a5a2b"/>
    <rect x="-130" y="-52" width="260" height="122" rx="18" fill="none" stroke="#5e3a17" stroke-width="10"/>
    <rect x="-130" y="-14" width="260" height="20" fill="#f2c14e" opacity=".9"/>
    <rect x="-22" y="-52" width="44" height="122" fill="#f2c14e" stroke="#b7861f" stroke-width="6"/>
    <circle cx="0" cy="6" r="16" fill="#ffe9a8" stroke="#b7861f" stroke-width="6"/>
  </g>

  <!-- front gems in front of chest -->
  <g transform="translate(150,352) scale(0.6)"><use href="#gem"/></g>
  <g transform="translate(362,352) scale(0.6)"><use href="#gem"/></g>
  <g transform="translate(256,240) scale(1.0)"><use href="#gem"/></g>

  <text x="256" y="474" text-anchor="middle" font-family="Arial Black, Arial, sans-serif" font-weight="900" font-size="82" fill="#ffffff" stroke="#241546" stroke-width="10" paint-order="stroke">1200</text>
</svg>
